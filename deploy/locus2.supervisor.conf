; Proposed locus2 supervisor program — Go binary instead of the JVM launcher.
;
; Current (java, generated by herman from server-app-configs/.../locus2/application.hocon):
;   command = /home/dev/apps/locus2/bin/locus2
;
; Change ONLY the command (and add the TZ env); keep everything else identical to
; the existing program so behaviour (manual start/stop, logging) is unchanged.
;
; - The binary is deployed to /home/dev/bin/locus by deploy.sh.
; - directory stays /home/dev/apps/locus2, where herman places config/config.hocon,
;   so the default `-config config/config.hocon` resolves correctly.
; - TZ is pinned to America/New_York so maven-metadata <lastUpdated> and directory
;   timestamps are byte-identical to the verified production output (the JVM used
;   the host's local zone; pinning makes it explicit and host-independent).
;
; NOTE: this .conf is generated into proxmox-hosts/nixgen/a8-apps/supervisor/managed/
; by herman. Applying this change durably requires either teaching herman/
; application.hocon about a non-JVM (binary) app, or overriding the managed conf.
; See deploy/README.md.

[program:locus2]

command = /home/dev/bin/locus -config config/config.hocon

directory = /home/dev/apps/locus2

environment = TZ="America/New_York"

autostart = false
autorestart = false
startretries    = 0
startsecs       = 5
redirect_stderr = true
stopasgroup     = true
killasgroup     = true
user            = dev

; Log configuration - limit size to prevent unbounded growth
stdout_logfile          = /var/log/supervisor/locus2.log
stdout_logfile_maxbytes = 10MB
stdout_logfile_backups  = 0
